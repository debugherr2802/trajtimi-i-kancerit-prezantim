order-radius:0!important;box-shadow:none!important}body{gap:0!important}<\/style><\/head><body>\n<div id=\"stage\"><canvas id=\"c\" width=\"1920\" height=\"1080\"><\/canvas>\n<div id=\"card\">\n<div class=\"tema\">TEMA:<\/div>\n<div class=\"title\">TRAJTIMI I KANCERIT<\/div>\n<div class=\"bar\"><\/div>\n<div class=\"l\"><b>Lënda:<\/b> Biologji me zgjedhje<\/div>\n<div class=\"l\"><b>Klasa:<\/b> XII<\/div>\n<div class=\"l\"><b>Punoi:<\/b> Rea Manaj<\/div>\n<div class=\"l\"><b>Pranoi:<\/b> Mësuese Blerina Purbollari<\/div>\n<\/div><\/div>\n<button id=\"re\">↻ Riluaj<\/button>\n<script>\nconst cv=document.getElementById('c'),g=cv.getContext('2d'),W=1920,H=1080;\nconst els=[...document.querySelectorAll('#card .tema,#card .title,#card .bar,#card .l')];\nconst card=document.getElementById('card');\nconst starts=[7.2,7.6,8.0,8.4,8.7,9.0,9.3];\nlet seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;\nconst pal=[[95,242,224],[255,122,200],[170,140,255],[255,214,120]];\nconst cells=[];\nfor(let i=0;i<16;i++){const c=pal[i%4];cells.push({x:R()*W,y:R()*H,r:50+R()*70,c,d:.5+R()*1,ph:R()*6.28,sp:.3+R()*.5,orb:i<3?{a:i*2.1,rad:330+i*40,s:.5-i*.1}:null});}\nconst dust=Array.from({length:130},()=>({x:R()*W,y:R()*H,r:1.5+R()*4,d:.3+R()*1.5,ph:R()*6.28,h:R()<.5?180:320}));\nconst hero={x:W/2,y:H/2,r:230};\nconst ease=x=>x<0?0:x>1?1:x*x*(3-2*x),cl=(x)=>Math.max(0,Math.min(1,x));\nfunction bg(t){\nconst gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#0a0f3a');gr.addColorStop(.55,'#1c1260');gr.addColorStop(1,'#4a1b85');\ng.fillStyle=gr;g.fillRect(0,0,W,H);\n[[300,250,500,'95,242,224'],[1600,800,600,'255,122,200'],[1500,200,400,'140,110,255']].forEach(([x,y,r,c],i)=>{\nconst px=x+Math.sin(t*.3+i)*40,rg=g.createRadialGradient(px,y,0,px,y,r);rg.addColorStop(0,`rgba(${c},.28)`);rg.addColorStop(1,`rgba(${c},0)`);g.fillStyle=rg;g.fillRect(0,0,W,H);});\n}\nfunction cell(x,y,r,c,t,ph,mood){\ng.save();g.translate(x,y);\nconst [a,b,d]=c;\n// glow\nlet rg=g.createRadialGradient(0,0,r*.8,0,0,r*1.7);rg.addColorStop(0,`rgba(${a},${b},${d},.35)`);rg.addColorStop(1,`rgba(${a},${b},${d},0)`);g.fillStyle=rg;g.beginPath();g.arc(0,0,r*1.7,0,6.283);g.fill();\n// body wobble\ng.beginPath();for(let i=0;i<=48;i++){const th=i/48*6.283,k=1+.05*Math.sin(th*3+t*1.6+ph)+.03*Math.sin(th*5-t*1.2+ph);const px=Math.cos(th)*r*k*(1+.03*Math.sin(t*2+ph)),py=Math.sin(th)*r*k*(1-.03*Math.sin(t*2+ph));i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();\nrg=g.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.1);rg.addColorStop(0,`rgb(${Math.min(255,a+70)},${Math.min(255,b+70)},${Math.min(255,d+70)})`);rg.addColorStop(1,`rgb(${a*.8|0},${b*.8|0},${d*.85|0})`);\ng.fillStyle=rg;g.fill();g.lineWidth=r*.05;g.strokeStyle='rgba(255,255,255,.55)';g.stroke();\n// nucleus\ng.beginPath();g.ellipse(r*.28,-r*.32,r*.26,r*.22,.4,0,6.283);g.fillStyle='rgba(90,40,170,.45)';g.fill();\ng.beginPath();g.arc(r*.3,-r*.34,r*.08,0,6.283);g.fillStyle='rgba(255,255,255,.5)';g.fill();\n// highlight\ng.beginPath();g.ellipse(-r*.45,-r*.5,r*.2,r*.1,-.6,0,6.283);g.fillStyle='rgba(255,255,255,.6)';g.fill();\n// eyes\nconst bl=(Math.sin(t*.9+ph*3)>.97)?.12:1,ex=r*.3,ey=r*.08,er=r*.15;\nfor(const s of[-1,1]){g.save();g.translate(s*ex*.75-r*.05,ey);g.scale(1,bl);g.beginPath();g.ellipse(0,0,er,er*1.25,0,0,6.283);g.fillStyle='#fff';g.fill();\ng.beginPath();g.arc(Math.sin(t*.7+ph)*er*.3,er*.1,er*.62,0,6.283);g.fillStyle='#1b1450';g.fill();g.beginPath();g.arc(Math.sin(t*.7+ph)*er*.3+er*.2,-er*.1,er*.2,0,6.283);g.fillStyle='#fff';g.fill();g.restore();\ng.beginPath();g.ellipse(s*ex*1.45-r*.05,ey+r*.3,r*.1,r*.06,0,0,6.283);g.fillStyle='rgba(255,90,160,.45)';g.fill();}\n// smile\ng.beginPath();g.arc(-r*.05,r*.22,r*.17,.15*3.14,.85*3.14);g.lineWidth=r*.05;g.lineCap='round';g.strokeStyle='#1b1450';g.stroke();\ng.restore();\n}\nfunction frame(t){\nbg(t);\n// camera\nconst z=t<5?2.1-.25*t/5:1.85-.85*ease((t-5)/2.6);\nconst pan=t<5?Math.sin(t*.5)*60:Math.sin(5*.5)*60*(1-ease((t-5)/2.6));\nconst px=-300*(1-ease((t-5)/2.6))*(t<5?t/5:1)+0;\ng.save();g.translate(W/2,H/2);g.scale(z,z);g.translate(-W/2+pan*0+px*.0,-H/2);\n// dust\ndust.forEach(p=>{const x=(p.x+t*12*p.d)%W,y=p.y+Math.sin(t*.8+p.ph)*20*p.d,a=.4+.4*Math.sin(t*2+p.ph);\nconst rg=g.createRadialGradient(x,y,0,x,y,p.r*4);rg.addColorStop(0,`hsla(${p.h},100%,80%,${a})`);rg.addColorStop(1,`hsla(${p.h},100%,70%,0)`);g.fillStyle=rg;g.beginPath();g.arc(x,y,p.r*4,0,6.283);g.fill();});\n// small cells (depth sorted, parallax)\nconst k=ease((t-5)/2.6);\ncells.slice().sort((a,b)=>a.d-b.d).forEach(c=>{\nlet x,y;\nif(c.orb){const a=c.orb.a+t*c.orb.s;const hx=hero.x+(1-k)*0+k*(1560-960),hy=hero.y+k*(830-540);x=hx+Math.cos(a)*c.orb.rad*(1-.35*k);y=hy+Math.sin(a)*c.orb.rad*.55*(1-.35*k);}\nelse{x=(c.x+Math.sin(t*c.sp+c.ph)*70+t*10*c.d+(t<5?t*-25*c.d:-125*c.d))%W;if(x<0)x+=W;y=c.y+Math.cos(t*c.sp*.8+c.ph)*55;}\nconst sc=.7+.3*c.d;g.globalAlpha=.55+.4*Math.min(1,c.d);cell(x,y,c.r*sc,c.c,t,c.ph);g.globalAlpha=1;});\n// hero\nconst hx=hero.x+k*600,hy=hero.y+k*290+Math.sin(t*1.2)*12*(1-k),hr=hero.r*(1-.35*k);\ncell(hx,hy,hr,[255,130,200],t,0);\n// halo particles around hero\nfor(let i=0;i<14;i++){const a=i/14*6.283+t*.6,rr=hr*1.35+Math.sin(t*2+i)*18;const x=hx+Math.cos(a)*rr,y=hy+Math.sin(a)*rr;\nconst rg=g.createRadialGradient(x,y,0,x,y,16);rg.addColorStop(0,'rgba(255,255,255,.95)');rg.addColorStop(1,'rgba(95,242,224,0)');g.fillStyle=rg;g.beginPath();g.arc(x,y,16,0,6.283);g.fill();}\ng.restore();\n// vignette\nconst v=g.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*1.1);v.addColorStop(0,'rgba(5,5,30,0)');v.addColorStop(1,'rgba(5,5,30,.65)');g.fillStyle=v;g.fillRect(0,0,W,H);\n// intro fade\nconst f=1-cl(t/1.2);if(f>0){g.fillStyle=`rgba(7,10,31,${f})`;g.fillRect(0,0,W,H);}\n// text\ncard.style.opacity=ease((t-6.8)/.8);\nels.forEach((e,i)=>{const p=ease((t-starts[i])/.7);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*14}px)`;});\n}\nlet t0;function loop(n){if(!t0)t0=n;const t=Math.min((n-t0)/1000*1.0,11.5);frame(t);if(t<11.5)requestAnimationFrame(loop);}\nfunction play(){t0=0;requestAnimationFrame(loop);}\ndocument.getElementById('re').onclick=play;\n(document.fonts?document.fonts.ready:Promise.resolve()).then(play);\n<\/script><\/body><\/html>\n", "<!DOCTYPE html>\n<html lang=\"sq\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Çështjet kryesore – Skena 2<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml,body{margin:0;height:100%;background:#070a1f;font-family:'Poppins',system-ui,sans-serif}\nbody{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}\n#stage{position:relative;width:min(100vw,calc((100vh - 70px)*16/9));aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:12px;box-shadow:0 20px 60px #0008;background:#0a0f3a}\n#world{position:absolute;inset:0}\ncanvas#c{position:absolute;inset:0;width:100%;height:100%}\n.p{position:absolute;width:29.4cqw;height:16.2cqw;border-radius:2cqw;overflow:hidden;background:linear-gradient(160deg,#1a1650c0,#46207899);backdrop-filter:blur(8px);opacity:0;text-align:center;color:#fff}\n.p canvas{width:100%;display:block}\n.p .t{font-weight:600;font-size:1.4cqw;white-space:nowrap;padding-top:.6cqw}\n.p .n{position:absolute;left:1.2cqw;top:1.2cqw;width:2.8cqw;height:2.8cqw;border-radius:50%;font-weight:800;font-size:1.5cqw;line-height:2.8cqw;color:#150f45}\nh1{position:absolute;left:0;right:0;top:2.4cqw;margin:0;text-align:center;font-weight:800;font-size:4.2cqw;letter-spacing:.2cqw;background:linear-gradient(90deg,#5ff2e0,#fff 45%,#ff7ac8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .3cqw .8cqw #0007);opacity:0}\n#fade{position:absolute;inset:0;background:#070a1f;pointer-events:none}\n <\/div>\n<div id=\"steps\"><span>1 · Qeliza e shëndetshme<i><\/i><\/span><span>2 · Mutacioni në ADN<i><\/i><\/span><span>3 · Ndarje e pakontrolluar<i><\/i><\/span><span>4 · Përhapja në trup<i><\/i><\/span><\/div>\n<div id=\"facts\"><\/div>\n<div id=\"def\">Kanceri është rritja dhe ndarja e pakontrolluar e qelizave, që mund të përhapen në pjesë të tjera të trupit.<\/div>\n<div id=\"cards\"><div><b>1<\/b><span>Qelizë e shëndetshme<\/span><\/div><div><b>2<\/b><span>Mutacion në ADN<\/span><\/div><div><b>3<\/b><span>Ndarje e pakontrolluar<\/span><\/div><div><b>4<\/b><span>Përhapje (metastazë)<\/span><\/div><\/div>\n<div id=\"chips\"><button>☀️ Rrezet UV<\/button><button>🚬 Duhani<\/button><button>🦠 Viruset<\/button><button>🧬 Trashëgimia<\/button><button id=\"rs\">↺ Riprovo<\/button><\/div>\n<div id=\"slide\"><\/div>\n<div id=\"cap\"><\/div><\/div>\n<div id=\"nav\"><button id=\"pv\">◀<\/button><button>1 · Qeliza<\/button><button>2 · ADN<\/button><button>3 · Ndarja<\/button><button>4 · Metastaza<\/button><button id=\"nx\">▶<\/button><button id=\"au\" class=\"on\">▶ Auto<\/button><\/div>\n<script>\nconst $=id=>document.getElementById(id),g=$('c').getContext('2d'),W=1920,H=1080;\nconst cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)},mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k|0);\nconst T=[95,242,224],P=[255,122,200],V=[170,140,255],AB=[175,130,215],HC=[T,P,V];\nconst TT=['Qeliza e shëndetshme','Mutacioni në ADN','Ndarje e pakontrolluar','Përhapja në trup'];\nconst CAP=['Qelizat e shëndetshme ndahen vetëm kur trupi ka nevojë dhe ndalojnë kur marrin sinjalin STOP.','Një mutacion në ADN dëmton gjenet që kontrollojnë ndarjen e qelizës.','Qelizat e mutuara injorojnë sinjalin STOP dhe ndahen pa kontroll, duke formuar një tumor.','Qelizat malinje mund të udhëtojnë nëpër trup dhe të krijojnë tumore të reja (metastaza).'];\nconst HINT=['👆 Kliko një qelizë që ta ndash','👆 Zgjidh një shkak ose kliko ADN-në','👆 Kliko qelizat e mutuara','👆 Kliko një qelizë të tumorit'];\nlet SLP=false;const SL=[{\"h\": \"Qeliza e shëndetshme: rritje e kontrolluar\", \"c\": [[\"🔄\", \"Ndarja normale (mitoza)\", \"Qelizat ndahen për të rritur trupin, për të zëvendësuar qelizat e vjetra dhe për të riparuar indet e dëmtuara.\"], [\"🧬\", \"ADN-ja si udhëzues\", \"Gjenet në ADN përcaktojnë kur një qelizë duhet të ndahet, të ndalojë ose të vdesë.\"], [\"✋\", \"Pikat e kontrollit\", \"Para ndarjes qeliza kontrollon ADN-në. Nëse dëmtimi nuk riparohet, ajo shkatërrohet vetë.\"]], \"g\": \"Mitozë — ndarja e një qelize në dy qeliza identike; Apoptozë — vdekja e programuar e qelizës; Cikli qelizor — fazat nga një ndarje te tjetra.\", \"k\": \"Në pak fjalë: qelizat e shëndetshme ndahen vetëm kur duhet dhe ndalojnë me sinjalin STOP.\"}, {\"h\": \"Mutacioni: dëmtimi i ADN-së\", \"c\": [[\"⚡\", \"Çfarë është mutacioni?\", \"Është një ndryshim i përhershëm në vargun e ADN-së, që mund të dëmtojë një gjen.\"], [\"🎯\", \"Gjenet kyçe\", \"Kanceri lidhet me onkogjenet, që nxitin ndarjen, dhe me gjenet frenuese, si p53, që e ndalojnë atë.\"], [\"☀️\", \"Shkaqet\", \"Rrezet UV, duhani, disa viruse dhe trashëgimia mund të shkaktojnë mutacione.\"]], \"g\": \"Mutacion — ndryshim i ADN-së; Onkogjen — gjen që nxit ndarjen kur dëmtohet; Gjen frenues (p53) — ndalon ndarjen ose nxit apoptozën.\", \"k\": \"Në pak fjalë: kanceri fillon kur mutacione të shumta dëmtojnë gjenet që kontrollojnë ndarjen.\"}, {\"h\": \"Ndarje e pakontrolluar: formimi i tumorit\", \"c\": [[\"📈\", \"Rritje e shpejtë\", \"Një qelizë bëhet 2, pastaj 4, 8, 16, dhe numri rritet gjithnjë e më shpejt.\"], [\"🚫\", \"Injoron sinjalet\", \"Qelizat e mutuara nuk i dëgjojnë sinjalet STOP dhe nuk vdesin kur dëmtohen.\"], [\"🟣\", \"Tumori\", \"Grumbulli i këtyre qelizave formon një tumor. Tumori beninj mbetet në vend, ai malinj pushton indet.\"]], \"g\": \"Tumor — grumbull qelizash; Beninj — rritje lokale, pa pushtim; Malinj — pushton indet dhe mund të përhapet; Kancerogjen — faktor që shkakton kancer.\", \"k\": \"Në pak fjalë: tumori është një grumbull qelizash që nuk kanë më kontroll.\"}, {\"h\": \"Metastaza: përhapja në trup\", \"c\": [[\"🌊\", \"Udhëtimi\", \"Qelizat malinje hyjnë në gjak ose në limfë dhe udhëtojnë në pjesë të tjera të trupit.\"], [\"📍\", \"Tumore të reja\", \"Ato vendosen në organe të tjera dhe formojnë tumore të reja, të quajtura metastaza.\"], [\"⏱️\", \"Stadet e kancerit\", \"Stadet I–IV tregojnë sa është rritur dhe përhapur kanceri. Zbulimi i hershëm do të thotë stad i ulët.\"]], \"g\": \"Metastazë — përhapja e kancerit në organe të largëta; Limfa — lëngu që përhap qelizat; Stadi — niveli i përhapjes (I–IV).\", \"k\": \"Në pak fjalë: metastaza e bën kancerin më të vështirë për t'u trajtuar.\"}, null];const AN=[8, 9, 9, 12];const DUR=[13.5, 14.5, 14.5, 17.5, 13];\nconst FACT=[['🔄 Qelizat ndahen për të rritur dhe riparuar indet.','🧬 ADN-ja e udhëzon qelizën kur duhet të ndahet.','✋ Sinjali STOP e ndalon ndarjen kur nuk nevojitet më.'],[],['📈 Një qelizë bëhet 2, pastaj 4, 8, 16…','🚫 Qelizat e mutuara nuk i dëgjojnë sinjalet STOP.','🟣 Tumori është një grumbull qelizash të pakontrolluara.'],['🟢 Tumori beninj mbetet në vend.','🔴 Tumori malinj pushton indet përreth dhe përhapet.','🌊 Qelizat udhëtojnë nëpërmjet gjakut ose limfës.']];\nconst INFO={UV:'☀️ Rrezet UV dëmtojnë ADN-në',Duhani:'🚬 Duhani dëmton ADN-në e mushkërive',Viruset:'🦠 Disa viruse dëmtojnë ADN-në',Trashëgimia:'🧬 Disa mutacione trashëgohen'};\nconst mutInfo=txt=>{const k=Object.keys(INFO).find(k=>(txt||'').includes(k));return k?INFO[k]:txt;};\nTT.push('Përmbledhje');CAP.push('Zbulimi i hershëm dhe trajtimi në kohë rrisin shanset për shërim.');HINT.push('');FACT.push([]);\nlet step=-1,st0=0,t=0,cells=[],sparks=[],trav=[],mut=[],cause='',causeT=-9,stopT=-9,auto=true,lastRel=0,uid=0;\nfunction glow(c,x,y,r,col,a){const rg=c.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(${col},${a})`);rg.addColorStop(1,`rgba(${col},0)`);c.fillStyle=rg;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();}\nfunction cell(c,x,y,r,col,t,ph,ab){\nc.save();c.translate(x,y);const[a,b,d]=col;glow(c,0,0,r*1.6,col.join(','),.3);\nc.beginPath();const w=ab?.08:.04;\nfor(let i=0;i<=40;i++){const th=i/40*6.283,k=1+w*Math.sin(th*(ab?5:3)+t*1.6+ph)+.025*Math.sin(th*5-t+ph),px=Math.cos(th)*r*k,py=Math.sin(th)*r*k;i?c.lineTo(px,py):c.moveTo(px,py);}\nc.closePath();\nconst rg=c.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.1);rg.addColorStop(0,`rgba(${Math.min(255,a+80)},${Math.min(255,b+80)},${Math.min(255,d+80)},.95)`);rg.addColorStop(1,`rgba(${a*.75|0},${b*.75|0},${d*.85|0},.92)`);\nc.fillStyle=rg;c.fill();c.lineWidth=r*.06;c.strokeStyle='rgba(255,255,255,.6)';c.stroke();\nc.save();c.clip();\nfor(let i=0;i<3;i++){const an=ph+i*2.1+t*.12;c.save();c.translate(Math.cos(an)*r*.6,Math.sin(an)*r*.55);c.rotate(an+1);c.beginPath();c.ellipse(0,0,r*.17,r*.09,0,0,6.283);c.fillStyle='rgba(255,185,140,.7)';c.fill();c.strokeStyle='rgba(180,70,90,.5)';c.lineWidth=r*.015;c.beginPath();c.moveTo(-r*.1,0);c.quadraticCurveTo(-r*.05,-r*.05,0,0);c.quadraticCurveTo(r*.05,r*.05,r*.1,0);c.stroke();c.restore();}\nc.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<7;i++){const an=ph*3+i*.9,rr=r*(.3+.07*(i%3));c.beginPath();c.arc(Math.cos(an)*rr,Math.sin(an)*rr,r*.02,0,6.283);c.fill();}\nc.restore();\nc.beginPath();c.ellipse(r*.28,-r*.32,r*.26,r*.22,.4,0,6.283);c.fillStyle='rgba(90,40,170,.5)';c.fill();c.beginPath();c.arc(r*.3,-r*.34,r*.08,0,6.283);c.fillStyle='rgba(255,255,255,.5)';c.fill();\nc.beginPath();c.ellipse(-r*.45,-r*.5,r*.2,r*.1,-.6,0,6.283);c.fillStyle='rgba(255,255,255,.55)';c.fill();\nconst bl=Math.sin(t*.9+ph*3)>.97?.12:1,er=r*.14;\nfor(const s of[-1,1]){c.save();c.translate(s*r*.2-r*.05,r*.1);c.scale(1,bl);c.beginPath();c.ellipse(0,0,er,er*1.25,0,0,6.283);c.fillStyle='#fff';c.fill();const ox=Math.sin(t*.7+ph)*er*.3;c.beginPath();c.arc(ox,er*.1,er*.62,0,6.283);c.fillStyle='#1b1450';c.fill();c.beginPath();c.arc(ox+er*.2,-er*.1,er*.2,0,6.283);c.fillStyle='#fff';c.fill();c.restore();\nif(ab){c.beginPath();c.moveTo(s*r*.2-r*.05-s*er,-r*.1);c.lineTo(s*r*.2-r*.05+s*er*.9,-r*.1-er*.7);c.lineWidth=r*.04;c.lineCap='round';c.strokeStyle='#1b1450';c.stroke();}}\nc.beginPath();c.lineWidth=r*.05;c.lineCap='round';c.strokeStyle='#1b1450';\nif(ab)c.arc(-r*.05,r*.46,r*.14,1.15*3.14,1.85*3.14);else c.arc(-r*.05,r*.25,r*.16,.15*3.14,.85*3.14);c.stroke();c.restore();}\nfunction label(txt,x,y,col){g.font='600 34px Poppins,sans-serif';const w=g.measureText(txt).width+44;g.fillStyle='rgba(20,15,70,.75)';g.beginPath();g.roundRect(x-w/2,y-30,w,60,30);g.fill();g.strokeStyle=`rgba(${col||'255,122,200'},.9)`;g.lineWidth=3;g.stroke();g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,x,y+2);}\nfunction stopSign(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.beginPath();for(let i=0;i<8;i++){const a=i*.785+.39;g.lineTo(Math.cos(a)*62,Math.sin(a)*62);}g.closePath();g.fillStyle='#ff4f8b';g.fill();g.lineWidth=6;g.strokeStyle='#fff';g.stroke();g.fillStyle='#fff';g.font='800 30px Poppins,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('STOP',0,2);g.restore();}\nfunction mk(x,y,R,ab,i){return{x,y,r:R*.8,R,ab,col:ab?AB:HC[i%3],ph:Math.random()*6.28,dv:0,ang:0,nd:t+1.5+Math.random()*2,hx:x,hy:y,k:0};}\nconst vy=x=>720+26*Math.sin(x/260),nsN=()=>cells.filter(c=>c.ns).length;\nfunction setStep(n){step=(n+5)%5;st0=t;cells=[];sparks=[];trav=[];mut=[];cause='';\nif(step==0)for(let i=0;i<6;i++){const a=i/6*6.283;cells.push(mk(960+Math.cos(a)*190,560+Math.sin(a)*90,62,0,i));}\nif(step==2){cells.push(mk(960,560,50,1,0));for(let i=0;i<10;i++){const a=i/10*6.283,c=mk(960+Math.cos(a)*330,560+Math.sin(a)*190,54,0,i);c.k=.8;cells.push(c);}}\nif(step==3){for(let i=0;i<9;i++){const a=i*2.4,rr=30+i*11;cells.push(mk(430+Math.cos(a)*rr,440+Math.sin(a)*rr,44,1,0));}\nfor(let i=0;i<4;i++){const a=i*1.57+.7,c=mk(1480+Math.cos(a)*90,480+Math.sin(a)*90,44,0,i);c.k=.8;cells.push(c);}}\n$('chip').textContent=(step+1)+' · '+TT[step];$('cap').textContent=CAP[step];$('hint').textContent=HINT[step];const d=SL[step];$('slide').innerHTML=d?`<div class=\"sh\">${d.h}<\/div><div class=\"sg\">${d.c.map(c=>`<div class=\"k\"><i>${c[0]}<\/i><b>${c[1]}<\/b><p>${c[2]}<\/p><\/div>`).join('')}<\/div><div class=\"gl k\">📘 <strong>Terma kyçe:<\/strong> ${d.g}<\/div><div class=\"kp k\">${d.k}<\/div>`:'';$('chips').style.display=step==1?'flex':'none';\n[...$('nav').children].forEach((b,i)=>b.classList.toggle('on',i==step+1));lastRel=t;}\nfunction divide(c){if(c.dv||c.tr)return;c.dv=t;c.ang=Math.random()*6.283;}\nfunction fin(c){const o=c.r*.85,cx=Math.cos(c.ang),sy=Math.sin(c.ang),d=mk(c.x+cx*o,c.y+sy*o,c.R,c.ab,0);d.col=c.col;d.ns=c.ns;d.k=c.k;d.hx=c.hx;d.hy=c.hy;d.r=c.r*.88;d.nd=t+2+Math.random()*2;c.x-=cx*o;c.y-=sy*o;c.r*=.88;c.dv=0;cells.push(d);}\nfunction sim(dt){\nfor(const c of cells){if(c.tr)continue;c.r+=(c.R-c.r)*Math.min(1,dt*2.5);\nif(c.dv){if(t-c.dv>1.1)fin(c);}\nelse if(t>c.nd){const ok=step==0?(!c.ab&&cells.length<14):step==2?(c.ab&&cells.length<36):(step==3&&c.ns&&nsN()<7);if(ok)divide(c);c.nd=t+(step==2?2.2:step==3?1.8:3.5)+Math.random()*1.5;}\nif(c.k){c.x+=(c.hx-c.x)*c.k*dt;c.y+=(c.hy-c.y)*c.k*dt;}\nconst pc=step==2&&c.ab?[960,560,.25]:step==3&&c.ab?(c.ns?[1480,480,.3]:[430,440,.25]):null;if(pc){c.x+=(pc[0]-c.x)*pc[2]*dt;c.y+=(pc[1]-c.y)*pc[2]*dt;}}\nfor(let it=0;it<3;it++)for(let i=0;i<cells.length;i++)for(let j=i+1;j<cells.length;j++){const a=cells[i],b=cells[j];if(a.tr||b.tr)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,m=(a.r+b.r)*.92-d;if(m>0){const u=m*.5/d;a.x-=dx*u;a.y-=dy*u;b.x+=dx*u;b.y+=dy*u;}}\nfor(const c of cells){if(c.tr)continue;\nif(step==0){const nx=(c.x-960)/(480-c.r),ny=(c.y-560)/(240-c.r),q=nx*nx+ny*ny;if(q>1){const s=1/Math.sqrt(q);c.x=960+(c.x-960)*s;c.y=560+(c.y-560)*s;}}\nelse{c.x=Math.max(c.r+40,Math.min(W-c.r-40,c.x));c.y=Math.max(260,Math.min(step==3?600:790,c.y));}}}\nfunction release(c){if(c.tr||c.ns||c.ab!=1||step!=3)return;const pts=[[c.x,c.y],[c.x+30,vy(c.x+30)-12]];for(let x=c.x+150;x<1460;x+=120) en — proteinë që e njeh imuniteti.\", \"k\": \"Në pak fjalë: imuniteti është mbrojtja natyrale e trupit kundër qelizave jonormale.\"}, {\"h\": \"Si i shpëton kanceri imunitetit\", \"c\": [[\"🎭\", \"Maskimi\", \"Disa qeliza kanceri shfaqin sinjale që i bëjnë të duken si qeliza të shëndetshme.\"], [\"🛑\", \"Frenat e imunitetit\", \"Ato aktivizojnë \\\"frena\\\", si proteina PD-1/PD-L1, që ngadalësojnë qelizat T, ndaj nuk sulmohen.\"], [\"📈\", \"Pasoja\", \"Qelizat e kancerit shumohen pa u shqetësuar nga sistemi imunitar.\"]], \"g\": \"Pikë kontrolli imuniteti (PD-1) — \\\"frenë\\\" mbi qelizat T; Imunitet i shmangur — kanceri fshihet nga imuniteti; Mikromjedis tumoral — mjedisi rreth tumorit.\", \"k\": \"Në pak fjalë: kanceri mund të fshihet ose të frenojë qelizat e imunitetit.\"}, {\"h\": \"Imunoterapia: zgjon mbrojtjen\", \"c\": [[\"💉\", \"Si vepron?\", \"Ilaçet e imunoterapisë heqin frenat e qelizave T dhe e bëjnë kancerin të dallueshëm.\"], [\"⚡\", \"Qeliza T të forta\", \"Qelizat e imunitetit rikthehen në veprim, e njohin kancerin dhe e sulmojnë.\"], [\"✅\", \"Përdorimi\", \"Përdoret në disa lloje kanceri, si melanoma dhe kanceri i mushkërive.\"]], \"g\": \"Frenues të pikave të kontrollit — ilaçe që heqin frenat e imunitetit; Antitrup — proteinë që lidhet me një objektiv të caktuar; Imunoterapi — trajtim që përdor imunitetin.\", \"k\": \"Në pak fjalë: imunoterapia e ndihmon trupin ta luftojë vetë kancerin.\"}, null];const AN=[7.5, 6.5, 9.5];let step=-1,st0=0,t=0;\nfunction glow(c,x,y,r,col,a){const rg=c.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(${col},${a})`);rg.addColorStop(1,`rgba(${col},0)`);c.fillStyle=rg;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();}\nfunction cell(c,x,y,r,col,t,ph,ab){\nc.save();c.translate(x,y);const[a,b,d]=col;glow(c,0,0,r*1.6,col.join(','),.3);\nc.beginPath();const w=ab?.08:.04;\nfor(let i=0;i<=40;i++){const th=i/40*6.283,k=1+w*Math.sin(th*(ab?5:3)+t*1.6+ph)+.025*Math.sin(th*5-t+ph),px=Math.cos(th)*r*k,py=Math.sin(th)*r*k;i?c.lineTo(px,py):c.moveTo(px,py);}\nc.closePath();\nconst rg=c.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.1);rg.addColorStop(0,`rgba(${Math.min(255,a+80)},${Math.min(255,b+80)},${Math.min(255,d+80)},.95)`);rg.addColorStop(1,`rgba(${a*.75|0},${b*.75|0},${d*.85|0},.92)`);\nc.fillStyle=rg;c.fill();c.lineWidth=r*.06;c.strokeStyle='rgba(255,255,255,.6)';c.stroke();\nc.save();c.clip();\nfor(let i=0;i<3;i++){const an=ph+i*2.1+t*.12;c.save();c.translate(Math.cos(an)*r*.6,Math.sin(an)*r*.55);c.rotate(an+1);c.beginPath();c.ellipse(0,0,r*.17,r*.09,0,0,6.283);c.fillStyle='rgba(255,185,140,.7)';c.fill();c.restore();}\nc.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<7;i++){const an=ph*3+i*.9,rr=r*(.3+.07*(i%3));c.beginPath();c.arc(Math.cos(an)*rr,Math.sin(an)*rr,r*.02,0,6.283);c.fill();}\nc.restore();\nc.beginPath();c.ellipse(r*.28,-r*.32,r*.26,r*.22,.4,0,6.283);c.fillStyle='rgba(90,40,170,.5)';c.fill();\nc.beginPath();c.ellipse(-r*.45,-r*.5,r*.2,r*.1,-.6,0,6.283);c.fillStyle='rgba(255,255,255,.55)';c.fill();\nconst bl=Math.sin(t*.9+ph*3)>.97?.12:1,er=r*.14;\nfor(const s of[-1,1]){c.save();c.translate(s*r*.2-r*.05,r*.1);c.scale(1,bl);c.beginPath();c.ellipse(0,0,er,er*1.25,0,0,6.283);c.fillStyle='#fff';c.fill();const ox=Math.sin(t*.7+ph)*er*.3;c.beginPath();c.arc(ox,er*.1,er*.62,0,6.283);c.fillStyle='#1b1450';c.fill();c.beginPath();c.arc(ox+er*.2,-er*.1,er*.2,0,6.283);c.fillStyle='#fff';c.fill();c.restore();\nif(ab){c.beginPath();c.moveTo(s*r*.2-r*.05-s*er,-r*.1);c.lineTo(s*r*.2-r*.05+s*er*.9,-r*.1-er*.7);c.lineWidth=r*.04;c.lineCap='round';c.strokeStyle='#1b1450';c.stroke();}}\nc.beginPath();c.lineWidth=r*.05;c.lineCap='round';c.strokeStyle='#1b1450';\nif(ab)c.arc(-r*.05,r*.46,r*.14,1.15*3.14,1.85*3.14);else c.arc(-r*.05,r*.25,r*.16,.15*3.14,.85*3.14);c.stroke();c.restore();}\nfunction label(txt,x,y,col){g.font='600 34px Poppins,sans-serif';const w=g.measureText(txt).width+44;g.fillStyle='rgba(20,15,70,.78)';g.beginPath();g.roundRect(x-w/2,y-30,w,60,30);g.fill();g.strokeStyle=`rgba(${col||'255,122,200'},.9)`;g.lineWidth=3;g.stroke();g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,x,y+2);}\nfunction sparkle(x,y,s,ph){g.save();g.translate(x,y);g.rotate(t+ph);g.globalAlpha*=.5+.5*Math.sin(t*4+ph);g.fillStyle='#fff';g.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.3:s;g.lineTo(Math.cos(i*.785)*r,Math.sin(i*.785)*r);}g.fill();g.restore();}\nfunction drop(x,y,r){glow(g,x,y,r*3,'95,242,224',.5);g.fillStyle='#5ff2e0';g.beginPath();g.moveTo(x,y-r*1.7);g.quadraticCurveTo(x+r*1.1,y-r*.2,x,y+r);g.quadraticCurveTo(x-r*1.1,y-r*.2,x,y-r*1.7);g.fill();g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(x-r*.3,y-r*.2,r*.25,0,6.283);g.fill();}\nfunction scalpel(x,y,rot){g.save();g.translate(x,y);g.rotate(rot);g.shadowColor='rgba(255,255,255,.6)';g.shadowBlur=18;g.fillStyle='#5ff2e0';g.beginPath();g.roundRect(90,-14,170,28,14);g.fill();g.fillStyle='#e8e4ff';g.beginPath();g.moveTo(0,0);g.lineTo(90,-15);g.lineTo(90,15);g.closePath();g.fill();g.restore();}\nfunction head(x,y,r,on){glow(g,x,y,r*1.8,'140,110,255',.35);const rg=g.createRadialGradient(x-r*.3,y-r*.4,r*.1,x,y,r*1.1);rg.addColorStop(0,'#d9ccff');rg.addColorStop(1,'#6a4fd8');g.fillStyle=rg;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();g.lineWidth=r*.07;g.strokeStyle='rgba(255,255,255,.6)';g.stroke();\ng.fillStyle='#fff';for(const s of[-1,1]){g.beginPath();g.ellipse(x+s*r*.3,y-r*.1,r*.14,r*.18,0,0,6.283);g.fill();}g.fillStyle='#1b1450';for(const s of[-1,1]){g.beginPath();g.arc(x+s*r*.3,y-r*.07,r*.08,0,6.283);g.fill();}\ng.beginPath();g.arc(x,y+r*.12,r*.25,.15*3.14,.85*3.14);g.lineWidth=r*.07;g.lineCap='round';g.strokeStyle='#1b1450';g.stroke();}\nconst TO=[[0,0],[-62,-26],[62,-26],[-62,44],[62,44],[0,-62],[0,68]];\nfunction tumor(tc,s,al,dx,dy){if(s<.1||al<=0)return;g.save();g.globalAlpha=al;TO.forEach((o,j)=>cell(g,tc.x+o[0]*s+dx,tc.y+o[1]*s+dy,42*s,AB,t,j,1));g.restore();}\nfunction tissue(tc,sx,sy){for(let i=0;i<18;i++){const a=i/18*6.283;cell(g,tc.x+Math.cos(a)*600*sx+Math.sin(t*.5+i)*6,tc.y+Math.sin(a)*215*sy+Math.cos(t*.4+i)*6,50,HC[i%3],t,i,0);}\n[[340,0],[-340,0],[230,75],[-230,75],[230,-75],[-230,-75]].forEach((o,i)=>cell(g,tc.x+o[0]*sx+Math.sin(t*.6+i)*6,tc.y+o[1]*sy+Math.cos(t*.5+i)*6,46,HC[(i+1)%3],t,i+3,0));}\nconst TC={x:960,y:500},TC2={x:1330,y:400},vv=x=>770+22*Math.sin(x/240);\n\nconst Y=[255,214,120];\nconst imm=(x,y,r,ph,pw)=>{if(pw>0)glow(g,x,y,r*2.4,'255,122,200',.5*pw);cell(g,x,y,r,Y,t,ph,0);};\nfunction glasses(x,y,r){g.lineWidth=r*.06;g.strokeStyle='#1b1450';g.fillStyle='rgba(255,255,255,.28)';for(const s of[-1,1]){g.beginPath();g.arc(x+s*r*.2-r*.05,y+r*.1,r*.2,0,6.283);g.fill();g.stroke();}}\nconst tc5=(x,y,r,dis,ph)=>{if(dis){cell(g,x,y,r,P,t,ph,0);glasses(x,y,r);}else cell(g,x,y,r,AB,t,ph,1);};\nconst patrol=(i,u,rx,ry,sp)=>{const a=u*sp+i*2.1;return{x:TC.x+Math.cos(a)*rx,y:TC.y+Math.sin(a)*ry};};\nfunction yab(x,y,s,rot){g.save();g.translate(x,y);g.rotate(rot);g.beginPath();g.moveTo(0,s);g.lineTo(0,0);g.lineTo(-s*.7,-s*.8);g.moveTo(0,0);g.lineTo(s*.7,-s*.8);g.lineWidth=s*.28;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#ff9bd6';g.shadowColor='#ff7ac8';g.shadowBlur=12;g.stroke();g.restore();}\nfunction qmark(x,y){g.fillStyle='rgba(20,15,70,.75)';g.beginPath();g.arc(x,y,26,0,6.283);g.fill();g.fillStyle='#fff';g.font='800 34px Poppins,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('?',x,y+2);}\nconst TG=[[60,10],[-30,-50],[-40,60]];\nfunction scene0(u){tissue(TC,1,1);\nconst ap=ease((u-1)/1),pop=ease((u-5.2)/1.2),tx=TC.x+60,ty=TC.y+10;\nif(ap>0&&pop<1){const r=46*ap*(1-pop);if(r>3)tc5(tx,ty,r,0,1);if(pop>0)for(let i=0;i<6;i++)sparkle(tx+Math.cos(i*1.05)*70*pop,ty+Math.sin(i*1.05)*70*pop,16*(1-pop),i);}\nconst a=ease((u-2.5)/2.6),sx=TC.x-460,sy=TC.y-140;\nimm(sx+(TC.x-sx)*a,sy+(ty-sy)*a,50,0,pop>0&&pop<1?1:0);\nfor(let i=1;i<3;i++){const p=patrol(i,u,330,120,.5);imm(p.x,p.y,44,i,0);}\nif(u>1.6&&u<5.2)label('Qelizë jonormale',tx,215);\nlabel('Qeliza e imunitetit',TC.x,805,'255,214,120');}\nfunction scene1(u){tissue(TC,1,1);\nTG.forEach((o,i)=>tc5(TC.x+o[0],TC.y+o[1],44,1,i));\nfor(let i=0;i<3;i++){const p=patrol(i,u,330,125,.45);imm(p.x,p.y,46,i,0);qmark(p.x,p.y-80-Math.sin(t*3+i)*5);}\nif(u>1)label('Qelizë tumorale e maskuar',TC.x,215,'255,122,200');\nlabel('Qeliza e imunitetit nuk e njeh',TC.x,805,'255,214,120');}\nfunction scene2(u){tissue(TC,1,1);\nconst rv=ease((u-3.6)/.6),k=ease((u-5)/2.6),pw=ease((u-3.8)/.8);\nTG.forEach((o,i)=>{const s=1-k,x=TC.x+o[0],y=TC.y+o[1];if(s>.06)tc5(x,y,44*s,rv<.5,i);if(u>3.6&&u<4.6)sparkle(x+30,y-40,20,i);});\nif(u>1&&u<4.4)for(let i=0;i<5;i++){const q=cl((u-1-i*.25)/2.4),x=TC.x-760+q*700,y=TC.y-200+i*100+Math.sin(q*6+i)*24;g.globalAlpha=Math.sin(q*3.14);yab(x,y,30,Math.PI/2+.2*Math.sin(t*3+i));g.globalAlpha=1;}\nfor(let i=0;i<3;i++){const p=patrol(i,u,330,125,.45),tx=TC.x+TG[i][0]-80,ty=TC.y+TG[i][1];imm(p.x+(tx-p.x)*k,p.y+(ty-p.y)*k,48+6*pw,i,pw);}\nlabel(u<3.6?'Imunoterapia':u<5?'Maska hiqet!':'Qelizat e imunitetit sulmojnë',TC.x,805,u<3.6?'255,122,200':'255,214,120');}\nfunction summary(u){const cx=[374,960,1546],cy=610;\ncx.forEach((x,i)=>{const r=ease((u-3-i*1.2)/.7);if(r<=0)return;g.save();g.globalAlpha=r;g.translate(x,cy);g.scale(.6+.4*r,.6+.4*r);g.translate(-x,-cy);\nif(i==0){imm(x-85,cy,58,1,0);tc5(x+95,cy,38*(.65+.35*Math.abs(Math.sin(t*1.2))),0,1);sparkle(x+20,cy-70,16,0);}\nif(i==1){tc5(x+50,cy,62,1,1);imm(x-100,cy+30,46,2,0);qmark(x-100,cy-60);}\nif(i==2){tc5(x+85,cy,56,0,2);imm(x-100,cy+40,48,3,1);for(let k=0;k<3;k++)yab(x-70+((t*70+k*70)%200),cy-50+k*30,24,Math.PI/2);}\ng.restore();});}\n\nfunction bgd(){const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#0a0f3a');gr.addColorStop(.55,'#1c1260');gr.addColorStop(1,'#4a1b85');g.fillStyle=gr;g.fillRect(0,0,W,H);\n[[300,250,500,'95,242,224'],[1600,800,600,'255,122,200'],[1500,200,400,'140,110,255']].forEach(([x,y,r,c],i)=>glow(g,x+Math.sin(t*.3+i)*40,y,r,c,.28));\nfor(let i=0;i<9;i++)glow(g,(i*263+t*8)%W,(i*397)%H+Math.sin(t*.4+i)*30,140+i%3*50,i%2?'255,122,200':'95,242,224',.1);\nfor(let i=0;i<90;i++)glow(g,(i*97+t*14*(1+i%3))%W,(i*211)%H+Math.sin(t+i)*14,10,'200,255,250',.3+.3*Math.sin(t*2+i));}\nfunction setStep(n){step=n;st0=t;$('cap').textContent=CAP[n];const d=SL[n];$('slide').innerHTML=d?`<div class=\"sh\">${d.h}<\/div><div class=\"sg\">${d.c.map(c=>`<div class=\"k\"><i>${c[0]}<\/i><b>${c[1]}<\/b><p>${c[2]}<\/p><\/div>`).join('')}<\/div><div class=\"gl k\">📘 <strong>Terma kyçe:<\/strong> ${d.g}<\/div><div class=\"kp k\">${d.k}<\/div>`:'';}\nfunction frame(){const u=t-st0;\nif(step<3&&u>DUR[step])setStep(step+1);\nbgd();const z=1+.05*(1-ease(u/1));g.save();g.translate(W/2,H/2);g.scale(z,z);g.translate(-W/2,-H/2);\n[scene0,scene1,scene2,summary][step](u);\ng.restore();\nconst v=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.1);v.addColorStop(0,'rgba(5,5,30,0)');v.addColorStop(1,'rgba(5,5,30,.5)');g.fillStyle=v;g.fillRect(0,0,W,H);\ng.fillStyle=`rgba(7,10,31,${Math.max(1-cl(u/.5),step==2?cl((u-DUR[2]+.9)/.9):0)})`;g.fillRect(0,0,W,H);\nconst sl=step<3&&u>AN[step];SLP=sl;$('c').classList.toggle('dim',sl);$('slide').style.opacity=sl?ease((u-AN[step])/.6):0;$('cap').style.opacity=sl?0:1;\n[...$('slide').querySelectorAll('.k')].forEach((e,i)=>{const p=ease((u-AN[step]-.4-i*.5)/.5);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*2}cqw)`;});\n[...$('steps').children].forEach((e,i)=>{e.classList.toggle('on',i==step);e.firstElementChild.style.width=i==step?cl(u/DUR[step])*100+'%':'0';});\n$('def').style.opacity=step==3?ease((u-.6)/.8):0;\n[...$('cards').children].forEach((e,i)=>e.style.opacity=step==3?ease((u-3-i*1.2)/.7):0);}\n$('stage').onclick=()=>{if(step==3&&t-st0>DUR[3])setStep(0);};\nlet last=0;function loop(n){const dt=Math.min(.05,(n-last)/1000||.016)*(SLP?1:1.5);last=n;t+=dt;frame();requestAnimationFrame(loop);}\nsetStep(0);(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));\n<\/script><\/body><\/html>\n", "<!DOCTYPE html>\n<html lang=\"sq\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Efektet anësore dhe kujdesi<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml,body{margin:0;height:100%;background:#070a1f;font-family:'Poppins',system-ui,sans-serif}\nbody{display:flex;align-items:center;justify-content:center}\n#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:12px;box-shadow:0 20px 60px #0008;background:#0a0f3a;color:#fff;user-select:none}\ncanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}\n#ttl{position:absolute;left:0;right:0;top:1.3cqw;text-align:center;font-weight:800;font-size:3cqw;letter-spacing:.15cqw;background:linear-gradient(90deg,#5ff2e0,#fff 45%,#ff7ac8);-webkit-background-clip:text;background-clip:text;color:transparent}\n#steps{position:absolute;left:0;right:0;top:5.4cqw;display:flex;justify-content:center;gap:1cqw}\n#steps span{position:relative;padding:.4cqw 1.6cqw .6cqw;border-radius:3cqw;font-weight:600;font-size:1.25cqw;background:#1a165099;border:.12cqw solid #ffffff22;color:#ffffff88;overflow:hidden}\n#steps span.on{color:#fff;border-color:#5ff2e0}\n#steps i{position:absolute;left:0;bottom:0;height:.3cqw;width:0;background:linear-gradient(90deg,#5ff2e0,#ff7ac8)}\n#facts{position:absolute;left:4%;right:4%;bottom:6cqw;display:flex;gap:1.2cqw;justify-content:center}\n#facts div{flex:1;max-width:28cqw;text-align:center;font-weight:600;font-size:1.3cqw;line-height:1.3;padding:.7cqw 1cqw;border-radius:1.6cqw;background:#1a1650d0;border:.15cqw solid #5ff2e088;opacity:0}\n#cap{position:absolute;left:6%;right:6%;bottom:1.4cqw;text-align:center;font-weight:600;font-size:1.85cqw;line-he as trajtimit.\"];const FACT=[[], [], [], []];const DUR=[13.5, 13.5, 13.5, 12];let SLP=false;const SL=[{\"h\": \"Efektet anësore: çfarë ndodh?\", \"c\": [[\"⚠️\", \"Pse ndodhin?\", \"Trajtimet prekin edhe disa qeliza të shëndetshme që ndahen shpejt.\"], [\"😴\", \"Më të zakonshmet\", \"Lodhja, të përzierat, rënia e flokëve dhe ulja e mbrojtjes ndaj infeksioneve.\"], [\"⏳\", \"Të përkohshme\", \"Shumë efekte lehtësohen ose zhduken pas përfundimit të trajtimit.\"]], \"g\": \"Alopeci — rënia e flokëve; Nauze — e përzier; Imunosupresion — ulja e mbrojtjes së trupit.\", \"k\": \"Në pak fjalë: efektet anësore janë të pritshme, por mund të lehtësohen.\"}, {\"h\": \"Kujdesi mjekësor\", \"c\": [[\"🩺\", \"Kontrolle\", \"Mjeku ndjek gjendjen me analiza gjaku dhe kontrolle të rregullta.\"], [\"💊\", \"Ilaçe mbështetëse\", \"Ka ilaçe kundër të përzierave dhe dhimbjes, që e bëjnë trajtimin më të lehtë.\"], [\"🥗\", \"Ushqim dhe pushim\", \"Ushqimi i ekuilibruar, uji dhe pushimi ndihmojnë trupin të rimëkëmbet.\"]], \"g\": \"Antiemetik — ilaç kundër të përzierës; Analgjezik — ilaç kundër dhimbjes; Monitorim — ndjekja e vazhdueshme e gjendjes.\", \"k\": \"Në pak fjalë: ekipi mjekësor kujdeset për pacientin gjatë gjithë trajtimit.\"}, {\"h\": \"Pas trajtimit: ndjekja mjekësore\", \"c\": [[\"✅\", \"Remisioni\", \"Kur kanceri nuk zbulohet më me analiza dhe imazheri, themi se ka remision.\"], [\"📅\", \"Kontrolle periodike\", \"Mjeku e ndjek pacientin me analiza dhe imazheri për të zbuluar herët çdo ndryshim.\"], [\"🔁\", \"Rikthimi\", \"Nëse kanceri kthehet (reçidivë), trajtimi rifillon. Kontrollet rrisin shanset për ta kapur herët.\"]], \"g\": \"Remision — kanceri nuk zbulohet më; Reçidivë — rikthimi i kancerit; Imazheri — ekografi, rreze X, tomografi (CT) ose rezonancë (MRI).\", \"k\": \"Në pak fjalë: ndjekja e rregullt është pjesë e trajtimit.\"}, null];const AN=[8, 8, 8];let step=-1,st0=0,t=0;\nfunction glow(c,x,y,r,col,a){const rg=c.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`r
